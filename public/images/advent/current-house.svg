<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Atelier des possibles Advent house</title>
  <desc id="desc">A hand-drawn dark blue Advent house with 24 colourful numbered windows, a mauve roof and a glowing star above the entrance.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency=".015 .08" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#53657c"/><stop offset=".55" stop-color="#334e72"/><stop offset="1" stop-color="#4f3c75"/>
    </linearGradient>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M-3 17L17-3M3 23L23 3" stroke="#fff" stroke-opacity=".045" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="#101d36"/>
